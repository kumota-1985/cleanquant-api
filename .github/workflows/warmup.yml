name: Warm up flagship APIs

# ─────────────────────────────────────────────────────────────────────────────
# 目的: Render無料プランのコールドスタート(実測 21.4秒)を潰す。
#       RapidAPI はレイテンシをカードに表示し検索順位にも使うため、21秒表示は
#       「壊れたAPI」に見えて購読前に離脱される(実際 7登録/0コール)。
#
# ⚠️ 予算の制約(必読): Render無料枠は「ワークスペースあたり月750インスタンス時間」。
#    1ヶ月=約730時間なので、24時間起こせるのは実質1サービスだけ。
#    使い切ると【その月は全無料サービスが強制停止】= 全リスティングが死ぬ。
#
#    現在の見積り:
#      主力2本 × 8時間/日 × 30日            = 480 h
#      他サービスの日次ヘルスチェック起床(概算) ≈ 112 h  (15本 × 15分 × 30日)
#      ─────────────────────────────────────────────
#      合計                                  ≈ 592 h  < 750 h  ✅ (余裕 ~158h)
#
#    ➤ 温める本数や時間を増やすときは、必ずこの計算をやり直すこと。
#    ➤ Render ダッシュボードの使用量(Free instance hours)を月半ばに一度確認すること。
#
# 稼働窓: 06:00–13:59 UTC = 15:00–22:59 JST(日本の夕〜夜)/ 08:00–16:59 CET(欧州の業務時間)
# 間隔  : 5分ごと(GitHubのcronは遅延するため、Renderの15分スリープに対して余裕を持たせる)
# 費用  : このリポジトリはPublic → GitHub Actions は無料枠無制限
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "*/5 6-13 * * *"
  workflow_dispatch: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ping flagship APIs
        run: |
          # 温める対象(= 実際にローンチで宣伝する主力のみ。増やすと750h予算を超える)
          URLS="
          https://a11ywind-api.onrender.com/ping
          https://japan-zipcode-api.onrender.com/
          "
          for u in $URLS; do
            code=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 90 "$u" || echo "FAIL")
            echo "$u -> $code"
          done
